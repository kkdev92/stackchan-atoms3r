name: scorecard

# OpenSSF Scorecard reads this repository's supply-chain posture — whether actions
# are pinned to SHAs, whether the default branch is protected, whether workflow
# tokens are scoped down, whether a vulnerability can be reported privately.
#
# It earns its place because every other check tests the code, and none of them look
# at how the code gets published. Most of what it grades is settings, which no test
# would notice regressing. Results land next to CodeQL in the code scanning
# dashboard, so a slip in the release pipeline surfaces where a source bug would.
#
# It reports and changes nothing. Free on public repositories.
#
# Enable CodeQL first: the last step uploads SARIF, which needs code scanning on.

on:
  schedule:
    # Weekly. Nothing here reacts to the clock; it just needs to be often enough
    # that a settings change is not unmeasured for a month.
    - cron: "0 7 * * 1"
  # Branch protection and token permissions are settings rather than code, so a push
  # that does not touch them can still move the score. The default branch is the
  # only meaningful subject.
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analyse
    runs-on: ubuntu-latest
    permissions:
      # To upload the result to the code scanning dashboard.
      security-events: write
      # For the signed attestation Scorecard publishes about its own run.
      id-token: write
      contents: read
      actions: read
    steps:
      # Pinned to SHAs, which is one of the things this workflow grades.
      # Check for newer releases before copying these into a new repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing makes the score readable by anyone deciding whether to
          # depend on this, which is the point of measuring it.
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          sarif_file: results.sarif
